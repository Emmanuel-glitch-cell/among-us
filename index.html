<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sussy Baka Elisa</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    background-color: #070712;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    overflow: hidden;
    position: relative;
  }

  /* Fondo de estrellas */
  .stars {
    position: absolute;
    width: 100%;
    height: 100%;
    background-image: 
      radial-gradient(2px 2px at 50px 80px, #fff, transparent),
      radial-gradient(3px 3px at 150px 250px, #fff, transparent),
      radial-gradient(2px 2px at 300px 100px, #cbd5e0, transparent),
      radial-gradient(2.5px 2.5px at 450px 320px, #fff, transparent),
      radial-gradient(2px 2px at 600px 180px, #fff, transparent);
    background-size: 650px 400px;
    animation: drift 40s linear infinite;
    z-index: 0;
  }

  @keyframes drift {
    from { background-position: 0 0; }
    to { background-position: -650px 400px; }
  }

  /* Contenedor principal con animación de flotar */
  .scene {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 0 20px;
    animation: float 3.5s ease-in-out infinite;
  }

  @keyframes float {
    0%, 100% { transform: translateY(0px) rotate(-2deg); }
    50% { transform: translateY(-18px) rotate(2deg); }
  }

  /* Globo de diálogo */
  .speech-bubble {
    background: #ffffff;
    color: #1a202c;
    padding: 18px 30px;
    border-radius: 28px;
    border: 6px solid #000000;
    max-width: 480px;
    margin-bottom: 30px;
    position: relative;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6);
    text-align: center;
    line-height: 1.3;
  }

  .main-text {
    display: block;
    font-size: 28px;
    font-weight: 900;
    letter-spacing: 0.5px;
    margin-bottom: 6px;
  }

  .sub-text {
    display: block;
    font-size: 20px;
    font-weight: 800;
    color: #553c9a;
  }

  /* Pico del globo de diálogo */
  .speech-bubble::before {
    content: '';
    position: absolute;
    bottom: -24px;
    left: 50%;
    transform: translateX(-50%);
    border-width: 18px 16px 0;
    border-style: solid;
    border-color: #000000 transparent transparent;
  }

  .speech-bubble::after {
    content: '';
    position: absolute;
    bottom: -15px;
    left: 50%;
    transform: translateX(-50%);
    border-width: 13px 11px 0;
    border-style: solid;
    border-color: #ffffff transparent transparent;
  }

  /* Personaje Among Us (Morado) */
  .crewmate {
    position: relative;
    width: 150px;
    height: 200px;
  }

  /* Mochila */
  .backpack {
    position: absolute;
    left: -32px;
    top: 52px;
    width: 40px;
    height: 105px;
    background: #44337a; /* Morado oscuro */
    border: 8px solid #000000;
    border-right: none;
    border-radius: 24px 0 0 24px;
  }

  /* Cuerpo */
  .body {
    width: 100%;
    height: 165px;
    background: #6b46c1; /* Morado principal */
    border: 8px solid #000000;
    border-radius: 75px 75px 25px 25px;
    position: relative;
    overflow: hidden;
    box-shadow: inset -18px -15px 0px #44337a; /* Sombra interior morada */
  }

  /* Visor */
  .visor {
    position: absolute;
    top: 38px;
    right: -12px;
    width: 105px;
    height: 58px;
    background: #5bc0eb;
    border: 8px solid #000000;
    border-radius: 35px;
    box-shadow: inset -10px -10px 0px #2b8cbe;
    overflow: hidden;
  }

  /* Brillo blanco del visor */
  .visor::after {
    content: '';
    position: absolute;
    top: 6px;
    left: 16px;
    width: 52px;
    height: 14px;
    background: #ffffff;
    border-radius: 10px;
  }

  /* Piernas */
  .legs {
    display: flex;
    justify-content: space-between;
    padding: 0 12px;
    margin-top: -8px;
  }

  .leg {
    width: 52px;
    height: 48px;
    background: #44337a; /* Morado oscuro */
    border: 8px solid #000000;
    border-top: none;
    border-radius: 0 0 22px 22px;
  }
</style>
</head>
<body>

  <div class="stars"></div>

  <div class="scene">
    <div class="speech-bubble">
      <span class="main-text">Sussy baka Elisa</span>
      <span class="sub-text">Perro peruano sin pelo de color morado</span>
    </div>
    
    <div class="crewmate">
      <div class="backpack"></div>
      <div class="body">
        <div class="visor"></div>
      </div>
      <div class="legs">
        <div class="leg"></div>
        <div class="leg"></div>
      </div>
    </div>
  </div>

</body>
</html>
